twig:
    file_name_pattern: '*.twig'
    form_themes: ['bootstrap_5_layout.html.twig']
    paths:
        '%kernel.project_dir%/assets/styles': styles
    globals:
        alumni_name: '%env(ALUMNI_NAME)%'
        alumni_tel: '%env(ALUMNI_TEL)%'
        alumni_mail: '%env(ALUMNI_EMAIL)%'
        alumni_adress: '%env(ALUMNI_ADDRESS)%'

        base_title: '%env(BASE_TITLE)%'
        base_title_admin: '%env(BASE_TITLE_ADMIN)%'
        social_media: '%social_media%'

when@test:
    twig:
        strict_variables: true